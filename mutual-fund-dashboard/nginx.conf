server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is ~250 KB and the CSS ~50 KB; both compress to well under a
    # quarter of that. The API gzips its own responses separately.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Vite fingerprints asset filenames, so a given URL's contents never change
    # -- they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached: it is what points at the fingerprinted
    # bundle, so a stale copy would pin the browser to an old deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
