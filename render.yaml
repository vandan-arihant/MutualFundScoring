# Render blueprint: the FastAPI scoring service + the static dashboard.
#
# Values marked `sync: false` are never stored in this file -- Render prompts for
# them on first deploy and keeps them in the dashboard. The two upstream feed
# URLs are treated as credentials, so they belong there and nowhere else.
#
# NOTE on the free plan: a free web service spins down after ~15 minutes idle,
# and the in-process APScheduler stops with it, so the 06:30 IST refresh will be
# missed whenever the service is asleep. It self-heals -- the next cold start
# sees data older than 24h and runs a catch-up refresh before serving. For a
# guaranteed on-time daily refresh, move to a paid instance or drive
# POST /api/refresh from an external scheduler with X-Refresh-Token.

services:
  - type: web
    name: equity-mf-scoring-api
    runtime: python
    plan: free
    rootDir: EquityMFScoringModel/code
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      # Drops the localhost CORS origins and makes REFRESH_TOKEN mandatory.
      - key: APP_ENV
        value: production
      - key: SCHEME_MASTER
        sync: false
      - key: RISK
        sync: false
      - key: REFRESH_TOKEN
        sync: false
      # Set to the dashboard's URL below, e.g. https://equity-mf-dashboard.onrender.com
      - key: EXTRA_CORS_ORIGINS
        sync: false
      - key: REFRESH_HOUR
        value: "6"
      - key: REFRESH_MINUTE
        value: "30"
      - key: REFRESH_TZ
        value: Asia/Kolkata

  - type: web
    name: equity-mf-dashboard
    runtime: static
    rootDir: mutual-fund-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite inlines this at BUILD time, so changing it requires a redeploy.
      # Set it to the API service's URL, e.g. https://equity-mf-scoring-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Single-page app: serve index.html for any path the static files don't cover.
      - type: rewrite
        source: /*
        destination: /index.html
